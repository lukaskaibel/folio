# Uploads the iPhone and iPad app to TestFlight whenever the app changes on main, so every change can be tried on a
# device: `bundle exec fastlane ios beta`, as described under "For contributors" in the README. Builds are numbered
# <version> (<date and time>), e.g. 0.2.0 (2026.1017.1047); "What to Test" names the commit.
#
# Signing comes from secrets: the App Store Connect API key (APP_STORE_CONNECT_API_KEY_KEY_ID, _ISSUER_ID and _P8,
# the .p8's text) and a development and a distribution certificate of the team made for CI
# (DEVELOPMENT_CERTIFICATE_P12, DISTRIBUTION_CERTIFICATE_P12, base64, with CERTIFICATES_P12_PASSWORD).
name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - Notebook/**
      - Notebook.xcodeproj/**
      - Packages/**
      - Config/**
      - fastlane/Fastfile
      - Gemfile
      - Gemfile.lock
      - .github/workflows/testflight.yml
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time. A build that has started finishes; of the pushes waiting behind it, only the newest is built.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: iPhone and iPad
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPMENT_TEAM: S2F6F7JZ8C
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags say whether the version in Config/Shared.xcconfig is out already.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install the signing certificates and the API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          DEVELOPMENT_CERTIFICATE_P12: ${{ secrets.DEVELOPMENT_CERTIFICATE_P12 }}
          DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for certificate in DEVELOPMENT DISTRIBUTION; do
            variable="${certificate}_CERTIFICATE_P12"
            printf '%s' "${!variable}" | base64 --decode > "$RUNNER_TEMP/$certificate.p12"
            security import "$RUNNER_TEMP/$certificate.p12" -k "$keychain" -P "$CERTIFICATES_P12_PASSWORD" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$certificate.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APP_STORE_CONNECT_API_KEY_P8_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build and upload
        run: bundle exec fastlane ios beta

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
