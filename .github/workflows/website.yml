# Publishes Website/ to GitHub Pages (https://lukaskaibel.github.io/notebook/) when it changes on main.
# The social preview and the window pictures come from Design/, so the README and the website share them.
name: Website

on:
  push:
    branches: [main]
    paths:
      - Website/**
      - Design/social-preview.png
      - Design/screenshots/hero-*.webp
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R Website/. _site/
          cp Design/social-preview.png _site/
          cp Design/screenshots/hero-light.webp Design/screenshots/hero-dark.webp _site/images/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
